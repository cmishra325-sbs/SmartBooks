version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartbooks_postgres
    environment:
      POSTGRES_USER: smartbooks_admin
      POSTGRES_PASSWORD: smartbooks_dev_pass
      POSTGRES_DB: smartbooks_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Automatically initialize schemas on container boot
      - ./database/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbooks_admin -d smartbooks_development"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
